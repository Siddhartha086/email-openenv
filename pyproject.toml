[project]
name = "email_openenv"
version = "0.1.0"
description = "Email automation OpenEnv agent"
authors = [{ name = "Siddhartha" }]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "openenv>=0.1.13"
]

[project.scripts]
server = "server.app:app"

[tool.setuptools]
packages = ["email_openenv"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"